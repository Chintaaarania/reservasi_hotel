{% extends 'base.html' %}
{% block title %}{{ action }} Tipe Kamar{% endblock %}

{% block content %}
<h1 class="page-title">{{ action }} Tipe Kamar</h1>

<div style="background: #fff; padding: 24px; border-radius: 8px; max-width: 600px;">
    <form method="POST">
        <div class="form-group">
            <label>Nama Tipe Kamar</label>
            <input type="text" name="nama_tipe" class="form-control" value="{{ tipe.nama_tipe if tipe else '' }}" required>
        </div>
        <div class="form-group">
            <label>Harga Per Malam (Rp)</label>
            <input type="number" step="1000" name="harga_per_malam" class="form-control" value="{{ tipe.harga_per_malam if tipe else '' }}" required>
        </div>
        <div class="form-group">
            <label>Kapasitas (Orang)</label>
            <input type="number" name="kapasitas" class="form-control" value="{{ tipe.kapasitas if tipe else '' }}" required>
        </div>
        <div class="form-group">
            <label>Deskripsi</label>
            <textarea name="deskripsi" class="form-control" rows="3">{{ tipe.deskripsi if tipe else '' }}</textarea>
        </div>
        <button type="submit" class="btn btn-gold">Simpan</button>
        <a href="{{ url_for('tipe_kamar.index') }}" class="btn btn-primary">Batal</a>
    </form>
</div>
{% endblock %}
