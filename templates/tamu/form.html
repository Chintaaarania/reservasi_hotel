{% extends 'base.html' %}
{% block title %}{{ action }} Tamu{% endblock %}

{% block content %}
<h1 class="page-title">{{ action }} Data Tamu</h1>

<div style="background: #fff; padding: 24px; border-radius: 8px; max-width: 600px;">
    <form method="POST">
        <div class="form-group">
            <label>NIK / Nomor Paspor</label>
            <input type="text" name="nik_paspor" class="form-control" value="{{ tamu.nik_paspor if tamu else '' }}" required>
        </div>
        <div class="form-group">
            <label>Nama Lengkap</label>
            <input type="text" name="nama_lengkap" class="form-control" value="{{ tamu.nama_lengkap if tamu else '' }}" required>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" class="form-control" value="{{ tamu.email if tamu else '' }}">
        </div>
        <div class="form-group">
            <label>Nomor Telepon</label>
            <input type="text" name="nomor_telepon" class="form-control" value="{{ tamu.nomor_telepon if tamu else '' }}" required>
        </div>
        <div class="form-group">
            <label>Alamat</label>
            <textarea name="alamat" class="form-control" rows="3">{{ tamu.alamat if tamu else '' }}</textarea>
        </div>
        <button type="submit" class="btn btn-gold">Simpan Data</button>
        <a href="{{ url_for('tamu.index') }}" class="btn btn-primary">Batal</a>
    </form>
</div>
{% endblock %}
