
{% extends 'base.html' %}

{% block title %}{{ action }} Tamu{% endblock %}

{% block content %}

<div class="guest-form-page">

    <!-- HEADER -->
    <div class="guest-form-header">
        <div>
            <p class="guest-form-subtitle">HOTEL GRAND MANAGEMENT</p>
            <h1 class="page-title">{{ action }} Data Tamu</h1>
            <p class="guest-form-description">
                Lengkapi informasi identitas dan kontak tamu hotel.
            </p>
        </div>
    </div>

    <!-- FORM CARD -->
    <div class="guest-form-card">

        <div class="guest-form-card-heading">
            <div class="guest-form-icon">♙</div>
            <div>
                <h3>Informasi Data Tamu</h3>
                <p>Masukkan data tamu dengan lengkap dan benar.</p>
            </div>
        </div>

        <form method="POST" class="guest-create-form">

            <div class="guest-form-group">
                <label>NIK / Nomor Paspor</label>
                <input
                    type="text"
                    name="nik_paspor"
                    class="guest-form-control"
                    value="{{ tamu.nik_paspor if tamu else '' }}"
                    placeholder="Masukkan NIK atau nomor paspor"
                    required>
            </div>

            <div class="guest-form-group">
                <label>Nama Lengkap</label>
                <input
                    type="text"
                    name="nama_lengkap"
                    class="guest-form-control"
                    value="{{ tamu.nama_lengkap if tamu else '' }}"
                    placeholder="Masukkan nama lengkap"
                    required>
            </div>

            <div class="guest-form-group">
                <label>Email</label>
                <input
                    type="email"
                    name="email"
                    class="guest-form-control"
                    value="{{ tamu.email if tamu else '' }}"
                    placeholder="Contoh: nama@email.com">
            </div>

            <div class="guest-form-group">
                <label>Nomor Telepon</label>
                <input
                    type="text"
                    name="nomor_telepon"
                    class="guest-form-control"
                    value="{{ tamu.nomor_telepon if tamu else '' }}"
                    placeholder="Masukkan nomor telepon"
                    required>
            </div>

            <div class="guest-form-group">
                <label>Alamat</label>
                <textarea
                    name="alamat"
                    class="guest-form-control"
                    rows="4"
                    placeholder="Masukkan alamat lengkap tamu">{{ tamu.alamat if tamu else '' }}</textarea>
            </div>

            <!-- BUTTON -->
            <div class="guest-form-actions">

                <button type="submit" class="guest-save-btn">
                    Simpan Data
                </button>

                <a href="{{ url_for('tamu.index') }}"
                   class="guest-cancel-btn">
                    Batal
                </a>

            </div>

        </form>
    </div>

</div>

{% endblock %}
