{% extends 'base.html' %}
{% block title %}{{ action }} Kamar{% endblock %}

{% block content %}
<h1 class="page-title">{{ action }} Kamar</h1>

<div style="background: #fff; padding: 24px; border-radius: 8px; max-width: 600px;">
    <form method="POST">
        <div class="form-group">
            <label>Nomor Kamar</label>
            <input type="text" name="nomor_kamar" class="form-control" value="{{ kamar.nomor_kamar if kamar else '' }}" required>
        </div>
        <div class="form-group">
            <label>Tipe Kamar</label>
            <select name="tipe_kamar_id" class="form-control" required>
                {% for t in tipe_list %}
                <option value="{{ t.id }}" {% if kamar and kamar.tipe_kamar_id == t.id %}selected{% endif %}>{{ t.nama_tipe }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Status</label>
            <select name="status" class="form-control">
                <option value="tersedia" {% if kamar and kamar.status == 'tersedia' %}selected{% endif %}>Tersedia</option>
                <option value="terisi" {% if kamar and kamar.status == 'terisi' %}selected{% endif %}>Terisi</option>
                <option value="pemeliharaan" {% if kamar and kamar.status == 'pemeliharaan' %}selected{% endif %}>Pemeliharaan</option>
                <option value="kotor" {% if kamar and kamar.status == 'kotor' %}selected{% endif %}>Kotor</option>
            </select>
        </div>
        <button type="submit" class="btn btn-gold">Simpan</button>
        <a href="{{ url_for('kamar.index') }}" class="btn btn-primary">Batal</a>
    </form>
</div>
{% endblock %}
